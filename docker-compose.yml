services:
  backend:
    build: ./eleve-backend
    container_name: eleve-backend
    ports:
      - "5001:5001"
    env_file:
      - ./eleve-backend/.env
    restart: unless-stopped

  frontend:
    build: ./eleve-frontend
    container_name: eleve-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped